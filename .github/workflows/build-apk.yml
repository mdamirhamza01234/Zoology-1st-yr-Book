name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Install icon tool
        run: npm install @capacitor/assets sharp --no-save

      - name: Add Android project
        run: npx cap add android

      - name: Disable overscroll
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package //; s/;//')
          cat > "$F" <<EOF
          package $PKG;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().setOverScrollMode(android.view.View.OVER_SCROLL_NEVER);
                  }
              }
          }
          EOF
          cat "$F"

      - name: Prepare icon folder
        run: |
          mkdir -p assets
          echo "=== Repo mein ye PNG files mili ==="
          find . -type f -iname "*.png" -not -path "./node_modules/*" -not -path "./android/*" -not -path "./.git/*"
          echo "==================================="
          only=$(find . -type f -iname "*icon*only*.png" -not -path "./node_modules/*" -not -path "./android/*" | head -1)
          fore=$(find . -type f -iname "*icon*foreground*.png" -not -path "./node_modules/*" -not -path "./android/*" | head -1)
          echo "only = $only"
          echo "foreground = $fore"
          if [ -n "$only" ] && [ "$only" != "./assets/icon-only.png" ]; then cp "$only" assets/icon-only.png; fi
          if [ -n "$fore" ] && [ "$fore" != "./assets/icon-foreground.png" ]; then cp "$fore" assets/icon-foreground.png; fi
          ls -la assets

      - name: Check icon files
        run: |
          test -f assets/icon-only.png || { echo "icon-only.png repo mein nahi mili"; exit 1; }

      - name: Make padded icon and splash
        run: |
          node - <<'JS'
          const sharp = require('sharp');
          const fs = require('fs');
          (async () => {
            const trimmed = await sharp('assets/icon-only.png').ensureAlpha().trim().toBuffer();
            async function place(size, frac, bg) {
              const t = Math.round(size * frac);
              const logo = await sharp(trimmed).resize(t, t, { fit: 'inside' }).toBuffer();
              return sharp({ create: { width: size, height: size, channels: 4, background: bg } })
                .composite([{ input: logo, gravity: 'centre' }]).png().toBuffer();
            }
            const clear = { r: 0, g: 0, b: 0, alpha: 0 };
            const green = { r: 11, g: 37, b: 33, alpha: 1 };
            fs.writeFileSync('assets/icon-foreground.png', await place(1024, 0.85, clear));
            fs.writeFileSync('assets/splash.png', await place(2732, 0.4, green));
            fs.writeFileSync('assets/splash-dark.png', await place(2732, 0.4, green));
            fs.writeFileSync('www/app-logo.png', await sharp(trimmed).resize(512, 512, { fit: 'inside' }).png().toBuffer());
            console.log('icon, splash aur app-logo ban gaye');
          })();
          JS
          ls -la assets www

      - name: Make app icons
        # Icon ka background colour yahan hai (dono jagah same rakho)
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#0B2521' --iconBackgroundColorDark '#0B2521' --splashBackgroundColor '#0B2521' --splashBackgroundColorDark '#0B2521'

      - name: Fix icon background
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B2521</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' $RES/mipmap-anydpi-v26/*.xml
          cat $RES/mipmap-anydpi-v26/ic_launcher.xml
          find $RES -name "ic_launcher*" | head -30

      - name: Shorten PDF names
        run: |
          cd www/pdfs
          for f in [0-9]*_*.pdf; do
            mv "$f" "${f%%_*}.pdf"
          done
          for f in Chapter_[0-9][0-9]_*.pdf; do
            n=$((10#${f:8:2}))
            mv "$f" "unit-$n.pdf"
          done
          ls

      - name: Copy www into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/BSC-Zoology-1st-Year.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BSC-Zoology-APK
          path: out/BSC-Zoology-1st-Year.apk
