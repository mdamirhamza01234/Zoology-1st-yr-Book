name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Install icon tool
        run: npm install @capacitor/assets --no-save

      - name: Add Android project
        run: npx cap add android

      - name: Prepare icon folder
        run: |
          mkdir -p assets
          for f in icon-only.png icon-foreground.png; do
            src=$(find . -path ./node_modules -prune -o -path ./android -prune -o -name "$f" -print | grep -v '^./assets/' | head -1)
            if [ -n "$src" ]; then cp "$src" "assets/$f"; fi
          done
          ls -la assets

      - name: Check icon files
        run: |
          test -f assets/icon-only.png
          test -f assets/icon-foreground.png

      - name: Make app icons
        # Icon ka background colour yahan hai (dono jagah same rakho)
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#0B2521' --iconBackgroundColorDark '#0B2521'

      - name: Fix icon background
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B2521</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
          sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' $RES/mipmap-anydpi-v26/*.xml
          cat $RES/mipmap-anydpi-v26/ic_launcher.xml
          find $RES -name "ic_launcher*" | head -30

      - name: Shorten PDF names
        run: |
          cd www/pdfs
          for f in [0-9]*_*.pdf; do
            mv "$f" "${f%%_*}.pdf"
          done
          ls

      - name: Copy www into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BSC-Zoology-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
